      <h3 class="vv-h3" id="t-lojaloja">Loja a loja</h3>
      <div class="vv-seg" role="group" aria-label="Filtrar lojas">
        <button type="button" id="f-todas" data-f="todas" aria-pressed="true">Todas</button>
        <button type="button" id="f-acima" data-f="acima" aria-pressed="false">Acima da meta</button>
        <button type="button" id="f-abaixo" data-f="abaixo" aria-pressed="false">Abaixo da meta</button>
      </div>
    </div>
    <div class="vv-reads" id="reads" data-source="leitura_lojas lojas_calc fpmd_margem resumo"></div>

</div>

<script>
dash.calc('lojas_calc', {
  inputs: ['lojas'],
  title: 'Atingimento e projeção por loja',
  description: 'Faturamento sobre a meta do período, diferença, variação sobre 2025 e projeção mantendo o atingimento sobre a meta do mês.',
  fn: (lojas) => lojas.map(l => ({
    loja: l.loja,
    ating: l.fat / l.meta_periodo,
    dif: l.fat - l.meta_periodo,
    vs_ly: l.vs_ly_pct != null ? l.vs_ly_pct : (l.fat_ly_periodo ? l.fat / l.fat_ly_periodo - 1 : null),
    projecao: Math.round(l.meta_mes * l.fat / l.meta_periodo)
  }))
});

dash.calc('resumo', {
  inputs: ['lojas', 'rede'],
  title: 'Resumo da rede',
  description: 'Atingimento, variação sobre 2025 e projeção do mês da rede inteira.',
  fn: (lojas, rede) => {
    const r = rede[0];
    const metaMes = lojas.reduce((s, l) => s + l.meta_mes, 0);
    const proj = Math.round(lojas.reduce((s, l) => s + l.meta_mes * l.fat / l.meta_periodo, 0));
    return [{
      ating_periodo: r.fat / r.meta_periodo,
      dif_periodo: r.fat - r.meta_periodo,
      vs_ly: r.fat / r.fat_ly_periodo - 1,
      meta_mes: metaMes,
      projecao: proj,
      proj_pct: proj / metaMes,
      calcados_ating: r.calcados_bolsas_fat / r.calcados_bolsas_meta
    }];
  }
});

dash.calc('canais', {
  inputs: ['lojas'],
  title: 'E-commerce vs lojas físicas',
  description: 'Soma por canal; a variação sobre 2025 usa só lojas com venda no ano passado.',
  fn: (lojas) => ['Online', 'Loja física'].map(canal => {
    const ls = lojas.filter(l => l.canal === canal);
    const comp = ls.filter(l => l.fat_ly_periodo);
    const fat = ls.reduce((s, l) => s + l.fat, 0);
    const meta = ls.reduce((s, l) => s + l.meta_periodo, 0);
    return {
      canal, fat, meta, ating: fat / meta,
      vs_ly_comp: comp.reduce((s, l) => s + l.fat, 0) / comp.reduce((s, l) => s + l.fat_ly_periodo, 0) - 1
    };
  })
});

dash.calc('variacoes', {
  inputs: ['rede'],
  title: 'Variação vs 2025',
  description: 'Cada indicador da rede contra o mesmo período de 2025.',
  fn: (rede) => {
    const r = rede[0];
    return [
      ['Peças', r.pecas, r.pecas_ly],
      ['Tickets', r.tickets, r.tickets_ly],
      ['Faturamento', r.fat, r.fat_ly_periodo],
      ['Peças por ticket', r.pa, r.pa_ly],
      ['Preço médio', r.preco_medio, r.preco_medio_ly],
      ['Ticket médio', r.ticket_medio, r.ticket_medio_ly]
    ].map(([indicador, atual, ano_anterior]) => ({ indicador, atual, ano_anterior, variacao: atual / ano_anterior - 1 }));
  }
});

dash.calc('diario_calc', {
  inputs: ['diario'],
  title: 'Margem e markup por dia',
  description: 'Margem R$ = faturamento − custo do dia, ambos do modelo; markup = faturamento ÷ custo.',
  fn: (diario) => diario.map(r => ({
    mes: r.mes, dia: r.dia,
    fp_margem: (r.fp_fat_mod != null ? r.fp_fat_mod : r.fp_fat) - r.fp_custo,
    md_margem: (r.md_fat_mod != null ? r.md_fat_mod : r.md_fat) - r.md_custo,
    fp_markup: r.fp_custo ? (r.fp_fat_mod != null ? r.fp_fat_mod : r.fp_fat) / r.fp_custo : null,
    md_markup: r.md_custo ? (r.md_fat_mod != null ? r.md_fat_mod : r.md_fat) / r.md_custo : null
  }))
});

dash.calc('mensal_calc', {
  inputs: ['mensal'],
  title: 'Margem e markup por mês',
  description: 'Margem R$ = faturamento − custo; markup = faturamento ÷ custo, para FP, MD e total.',
  fn: (mensal) => mensal.map(r => ({
    mes: r.mes,
    fp_margem: r.fp_fat_mod - r.fp_custo,
    md_margem: r.md_fat_mod - r.md_custo,
    tot_margem: r.fp_fat_mod + r.md_fat_mod - r.fp_custo - r.md_custo,
    fp_markup: r.fp_fat_mod / r.fp_custo,
    md_markup: r.md_fat_mod / r.md_custo,
    tot_markup: (r.fp_fat_mod + r.md_fat_mod) / (r.fp_custo + r.md_custo)
  }))
});

(() => {
  const nf = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
  const cf = new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 2 });
  const pf = new Intl.NumberFormat('pt-BR', { style: 'percent', maximumFractionDigits: 1 });
  const p0 = new Intl.NumberFormat('pt-BR', { style: 'percent', maximumFractionDigits: 0 });
  const brl = v => 'R$ ' + cf.format(v);
  const brlFull = v => 'R$ ' + nf.format(v);
  const sgn = (v, f) => (v > 0 ? '+' : v < 0 ? '−' : '') + f(Math.abs(v));
  const day = s => { const [y, m, d] = String(s).split('-'); return d + '/' + m + '/' + y; };
  const cls = (el, v) => { if (!el) return; el.classList.remove('vv-good', 'vv-bad'); if (v != null) el.classList.add(v >= 0 ? 'vv-good' : 'vv-bad'); };
  const nice = s => s.replace(/^LOJA /, '').replace('ECOMMERCE', 'E-commerce').toLowerCase().replace(/(^|[\s-])\S/g, c => c.toUpperCase()).replace('Udi', 'UDI').replace('Rj', 'RJ').replace('Jk', 'JK').replace('Bh', 'BH');
  const tags = { positivo: ['Positivo', 'vv-good'], alerta: ['Alerta', 'vv-bad'], atencao: ['Atenção', 'vv-warn'], info: ['Contexto', ''] };
  const $ = s => document.querySelector(s);
  const fail = el => { el.innerHTML = ''; const d = document.createElement('div'); d.className = 'vv-fail'; d.textContent = 'Failed to load'; el.appendChild(d); };
  const setText = (sel, fmt, src, pick) => {
    document.querySelectorAll(sel).forEach(el => {
      const st = dash.data(src);
      if (st.status !== 'ok') { if (st.status === 'error') el.classList.remove('dash-skeleton'); return; }
      const v = pick(st.data, el);
      el.textContent = v == null ? '—' : fmt(v, el);
      el.classList.remove('dash-skeleton');
    });
  };
  let sortKey = 'fat', sortDir = -1;
  let drawnOnce = false;

  function tipFor(box) {
    let t = box.querySelector('.vv-tip');
    if (!t) { t = document.createElement('div'); t.className = 'vv-tip'; t.hidden = true; box.appendChild(t); }
    return t;
  }
  function showTip(box, tip, ev, lines) {
    tip.innerHTML = '';
    lines.forEach((l, i) => { const d = document.createElement('div'); if (i === 0) d.className = 'k'; d.textContent = l; tip.appendChild(d); });
    tip.hidden = false;
    const r = box.getBoundingClientRect();
    let x = ev.clientX - r.left + 12, y = ev.clientY - r.top + 12;
    x = Math.min(x, r.width - tip.offsetWidth - 4); x = Math.max(4, x);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }

  function drawAting() {
    const box = $('#c-ating');
    if (!box) return;
    const st = dash.data('lojas_calc');
    if (st.status === 'error') return fail(box);
    if (st.status !== 'ok') return;
    const rows = st.data.slice().sort((a, b) => b.ating - a.ating);
    box.querySelectorAll('svg').forEach(s => s.remove());
    const W = Math.max(280, box.clientWidth), rowH = 26;
    const svg = d3.select(box).insert('svg', ':first-child').attr('width', '100%').attr('viewBox', `0 0 ${W} ${rows.length * rowH + 24}`);
    const probe = svg.append('text').attr('font-size', 12).style('font-family', 'var(--font-anthropic-sans)');
    const labW = d3.max(rows, r => probe.text(nice(r.loja)).node().getComputedTextLength()) + 10;
    const endW = probe.text('188,0%  +R$ 534 mil').node().getComputedTextLength() + 8;
    probe.remove();
    const x = d3.scaleLinear([0, Math.max(1.1, d3.max(rows, r => r.ating))], [labW, W - endW]);
    const y = d3.scaleBand(rows.map(r => r.loja), [4, rows.length * rowH + 4]).padding(0.3);
    svg.append('g').selectAll('text').data(rows).join('text')
      .attr('x', labW - 8).attr('y', r => y(r.loja) + y.bandwidth() / 2).attr('dy', '0.35em').attr('text-anchor', 'end')
      .attr('font-size', 12).attr('fill', 'var(--color-fg)').text(r => nice(r.loja));
    svg.append('g').selectAll('rect').data(rows).join('rect')
      .attr('x', labW).attr('y', r => y(r.loja)).attr('height', y.bandwidth()).attr('rx', 4)
      .attr('width', r => Math.max(2, x(r.ating) - labW))
      .attr('fill', r => r.ating >= 1 ? dash.colors[0] : 'var(--cds-chart-status-critical)')
      .attr('fill-opacity', r => r.ating >= 1 ? 1 : 0.85);
    svg.append('g').selectAll('text').data(rows).join('text')
      .attr('x', r => x(r.ating) + 6).attr('y', r => y(r.loja) + y.bandwidth() / 2).attr('dy', '0.35em')
      .attr('font-size', 12).attr('fill', 'var(--color-fg-muted)').style('font-variant-numeric', 'tabular-nums')
      .text(r => pf.format(r.ating) + '  ' + sgn(r.dif, brl));
    svg.append('line').attr('x1', x(1)).attr('x2', x(1)).attr('y1', 0).attr('y2', rows.length * rowH + 8)
      .attr('stroke', 'var(--cds-chart-reference)').attr('stroke-dasharray', '4 3');
    svg.append('text').attr('x', x(1)).attr('y', rows.length * rowH + 20).attr('text-anchor', 'middle')
      .attr('font-size', 11).attr('fill', 'var(--color-fg-muted)').text('100%');
    const tip = tipFor(box);
    svg.append('g').selectAll('rect').data(rows).join('rect')
      .attr('x', 0).attr('width', W).attr('y', r => y(r.loja) - y.step() * y.paddingInner() / 2).attr('height', y.step()).attr('fill', 'transparent')
      .on('mousemove', (ev, r) => showTip(box, tip, ev, [nice(r.loja), '% meta: ' + pf.format(r.ating), 'Dif.: ' + sgn(r.dif, brlFull), 'vs. 2025: ' + (r.vs_ly == null ? 'sem base' : sgn(r.vs_ly, p0.format)), 'Projeção: ' + brl(r.projecao)]))
      .on('mouseleave', () => { tip.hidden = true; });
    box.style.minHeight = (rows.length * rowH + 24) * (box.clientWidth / W) + 'px';
  }

  function drawVar() {
    const box = $('#c-var');
    if (!box) return;
    const st = dash.data('variacoes');
    if (st.status === 'error') return fail(box);
    if (st.status !== 'ok') return;
    const rows = st.data;
    box.querySelectorAll('svg').forEach(s => s.remove());
    const W = Math.max(260, box.clientWidth), rowH = 30, H = rows.length * rowH + 8;
    const svg = d3.select(box).insert('svg', ':first-child').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
    const probe = svg.append('text').attr('font-size', 12);
    const labW = d3.max(rows, r => probe.text(r.indicador).node().getComputedTextLength()) + 10;
    probe.remove();
    const m = d3.max(rows, r => Math.abs(r.variacao));
    const x = d3.scaleLinear([-m, m], [labW + 44, W - 44]);
    const y = d3.scaleBand(rows.map(r => r.indicador), [4, H - 4]).padding(0.3);
    svg.append('line').attr('x1', x(0)).attr('x2', x(0)).attr('y1', 0).attr('y2', H).attr('stroke', 'var(--cds-chart-axis)');
    svg.append('g').selectAll('text').data(rows).join('text').attr('x', 0).attr('y', r => y(r.indicador) + y.bandwidth() / 2).attr('dy', '0.35em')
      .attr('font-size', 12).attr('fill', 'var(--color-fg)').text(r => r.indicador);
    svg.append('g').selectAll('rect').data(rows).join('rect')
      .attr('x', r => Math.min(x(0), x(r.variacao))).attr('width', r => Math.abs(x(r.variacao) - x(0)))
      .attr('y', r => y(r.indicador)).attr('height', y.bandwidth()).attr('rx', 4)
      .attr('fill', r => r.variacao >= 0 ? dash.colors[0] : dash.colors[1]);
    svg.append('g').selectAll('text').data(rows).join('text')
      .attr('x', r => r.variacao >= 0 ? x(r.variacao) + 5 : x(r.variacao) - 5).attr('text-anchor', r => r.variacao >= 0 ? 'start' : 'end')
      .attr('y', r => y(r.indicador) + y.bandwidth() / 2).attr('dy', '0.35em').attr('font-size', 12).attr('fill', 'var(--color-fg-muted)')
      .text(r => sgn(r.variacao, p0.format));
    const tip = tipFor(box);
    const fmtV = r => r.indicador === 'Peças por ticket' ? (v => v.toLocaleString('pt-BR', { minimumFractionDigits: 2 })) : (['Peças', 'Tickets'].includes(r.indicador) ? nf.format : brlFull);
    svg.append('g').selectAll('rect').data(rows).join('rect').attr('x', 0).attr('width', W)
      .attr('y', r => y(r.indicador) - y.step() * y.paddingInner() / 2).attr('height', y.step()).attr('fill', 'transparent')
      .on('mousemove', (ev, r) => showTip(box, tip, ev, [r.indicador, '2026: ' + fmtV(r)(r.atual), '2025: ' + fmtV(r)(r.ano_anterior), 'Variação: ' + sgn(r.variacao, p0.format)]))
      .on('mouseleave', () => { tip.hidden = true; });
    box.style.minHeight = H * (box.clientWidth / W) + 'px';
  }

  function drawCat() {
    const box = $('#c-cat');
    if (!box) return;
    const st = dash.data('categorias');
    if (st.status === 'error') return fail(box);
    if (st.status !== 'ok') return;
    box.innerHTML = '';
    const tot = d3.sum(st.data, r => r.fat), mx = d3.max(st.data, r => r.fat);
    st.data.forEach((r, i) => {
      const row = document.createElement('div'); row.className = 'vv-catrow';
      const a = document.createElement('span'); a.textContent = r.categoria;
      const track = document.createElement('div');
      const bar = document.createElement('div'); bar.className = 'vv-bar';
      bar.style.width = Math.max(1, 100 * r.fat / mx) + '%';
      if (i === 0) bar.style.background = dash.colors[0];
      track.appendChild(bar);
      const v = document.createElement('span');
      v.textContent = brl(r.fat) + ' · ' + pf.format(r.fat / tot) + ' · ' + nf.format(r.pecas) + ' pçs';
      row.append(a, track, v); box.appendChild(row);
    });
  }

  let readFilter = 'todas';
  document.querySelectorAll('.vv-seg button').forEach(b => b.addEventListener('click', () => {
    readFilter = b.dataset.f;
    document.querySelectorAll('.vv-seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    drawReads();
  }));

  const mesLab = s => { const [y, m] = s.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m - 1] + '/' + y.slice(2); };
  function orderTop() {
    const trw = $('#top-row'); if (!trw) return;
    ['REDE', 'LOJAS', 'ECOMMERCE'].forEach(k => { const c = trw.querySelector('[data-key="' + k + '"]'); if (c) trw.appendChild(c); });
  }
  function drawCanal() {
    const tb = $('#tb-canal tbody'); if (!tb) return;
    const st = dash.data('canal');
    if (st.status !== 'ok') { tb.innerHTML = ''; return; }
    tb.innerHTML = '';
    const mk = v => v == null || !isFinite(v) ? '—' : v.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + 'x';
    const pa = v => v == null ? '—' : v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const tm = v => v == null ? '—' : nf.format(v);
    const by = {};
    st.data.forEach(r => { (by[r.loja] = by[r.loja] || {})[r.canal] = r; });
    const lojas = Object.keys(by).filter(l => by[l].fisica && l !== 'LOJAS').sort((a, b) => by[b].total.fat - by[a].total.fat);
    if (by.LOJAS) lojas.push('LOJAS');
    const vals = r => [brl(r.fat), nf.format(r.pecas), nf.format(r.vendas), brl(r.fat_bruto - r.custo), mk(r.fat_bruto / r.custo), tm(r.tm), pa(r.pa)];
    lojas.forEach(l => {
      const f = by[l].fisica, o = by[l].online, t = by[l].total;
      const tr = document.createElement('tr'); tr.dataset.key = l; if (l === 'LOJAS') tr.className = 'tot';
      const c0 = document.createElement('td'); c0.textContent = l === 'LOJAS' ? 'Lojas físicas' : nice(l); tr.appendChild(c0);
      const c1 = document.createElement('td'); c1.className = 'sh'; c1.textContent = p0.format(o.fat / t.fat); tr.appendChild(c1);
      vals(f).forEach((v, i) => { const td = document.createElement('td'); td.textContent = v; if (i === 0) td.className = 'gs'; tr.appendChild(td); });
      vals(o).forEach((v, i) => { const td = document.createElement('td'); td.textContent = v; td.className = 'on' + (i === 0 ? ' gs' : ''); tr.appendChild(td); });
      tb.appendChild(tr);
    });
  }

  const evoSel = new Set();
  function drawEvo() {
    const box = $('#c-evo');
    const a = dash.data('mensal'), b = dash.data('mensal_calc');
    if (a.status === 'error' || b.status === 'error') return fail(box);
    if (a.status !== 'ok' || b.status !== 'ok') return;
    document.querySelectorAll('.vv-evo-leg i.fp').forEach(i => i.style.background = dash.colors[0]);
    document.querySelectorAll('.vv-evo-leg i.md').forEach(i => i.style.background = dash.colors[1]);
    const cm = new Map(b.data.map(r => [r.mes, r]));
    const mrows = a.data.slice().sort((p, q) => p.mes < q.mes ? -1 : 1).map(r => Object.assign({}, r, cm.get(r.mes)));
    const dd = dash.data('diario'), dc = dash.data('diario_calc');
    const dayOk = dd.status === 'ok' && dc.status === 'ok';
    const dmap = new Map(dayOk ? dc.data.map(r => [r.mes + '-' + r.dia, r]) : []);
    const drows = dayOk ? dd.data.map(r => Object.assign({}, r, dmap.get(r.mes + '-' + r.dia), { key: r.mes + '-' + String(r.dia).padStart(2, '0') })) : [];
    const withDays = new Set(drows.map(r => r.mes));
    const fbox = $('#evo-meses');
    fbox.innerHTML = '';
    mrows.forEach(r => {
      const bt = document.createElement('button'); bt.type = 'button'; bt.textContent = mesLab(r.mes);
      bt.setAttribute('aria-pressed', String(evoSel.has(r.mes)));
      if (!withDays.has(r.mes)) { bt.disabled = true; bt.title = 'Sem dados por dia para este mês ainda'; }
      bt.addEventListener('click', () => { evoSel.has(r.mes) ? evoSel.delete(r.mes) : evoSel.add(r.mes); drawEvo(); });
      fbox.appendChild(bt);
    });
    if (evoSel.size) { const c = document.createElement('button'); c.type = 'button'; c.className = 'clr'; c.textContent = 'Ver mês a mês'; c.addEventListener('click', () => { evoSel.clear(); drawEvo(); }); fbox.appendChild(c); }
    const daily = evoSel.size > 0;
    const rows = daily ? drows.filter(r => evoSel.has(r.mes)).sort((p, q) => p.key < q.key ? -1 : 1).map(r => Object.assign({}, r, { mes: r.key, _m: r.mes })) : mrows;
    $('#evo-hint').textContent = daily ? 'Por dia · margem com faturamento e custo do modelo' : 'Selecione meses para abrir por dia';
    const xl = r => daily ? (r.dia === 1 || r === rows[0] ? r.dia + '/' + mesLab(r._m).slice(0, 3) : String(r.dia)) : mesLab(r.mes) + (r.parcial ? '*' : '');
    box.querySelectorAll('svg').forEach(s => s.remove());
    const W = Math.max(300, box.clientWidth), panH = 92, gap = 26, top = 14, bot = 18;
    const H = top + 3 * panH + 2 * gap + bot;
    const svg = d3.select(box).insert('svg', ':first-child').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
    const L = 8, R = 64;
    const x = d3.scalePoint(rows.map(r => r.mes), [L + 4, W - R]);
    const cFP = dash.colors[0], cMD = dash.colors[1];
    const panels = [
      { title: 'Faturamento', y0: top, keys: ['fp_fat', 'md_fat'], total: true, fmt: brl, lab: v => new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 }).format(v) },
      { title: 'Peças', y0: top + panH + gap, keys: ['fp_qtd', 'md_qtd'], total: true, fmt: nf.format, lab: v => new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 }).format(v) },
      { title: 'Margem R$', y0: top + 2 * (panH + gap), keys: ['fp_margem', 'md_margem'], total: true, fmt: brl, lab: v => new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 }).format(v) }
    ];
    panels.forEach(p => {
      const mx = d3.max(rows, r => Math.max(r[p.keys[0]], r[p.keys[1]], p.total ? r[p.keys[0]] + r[p.keys[1]] : 0));
      p.y = d3.scaleLinear([0, mx * (p.total ? 1.14 : 1.08)], [p.y0 + panH - 12, p.y0 + 20]);
      svg.append('text').attr('x', L).attr('y', p.y0).attr('font-size', 11).attr('fill', 'var(--color-fg-muted)').attr('letter-spacing', '.04em').text(p.title.toUpperCase());
      svg.append('line').attr('x1', L).attr('x2', W - R).attr('y1', p.y0 + panH).attr('y2', p.y0 + panH).attr('stroke', 'var(--cds-chart-grid)');
      if (p.total) {

    const F = { fat: brlFull, fat_ly_periodo: brlFull, vs_ly: v => sgn(v, p0.format), meta_periodo: brlFull, ating: v => pf.format(v), dif: v => sgn(v, nf.format),
      desc_remarcacao_pct: pct, desc_loja_pct: pct, desc_total_pct: pct, tickets: nf.format, pecas: nf.format, pm: nf.format, tm: nf.format,
      pa: v => v.toLocaleString('pt-BR', { minimumFractionDigits: 2 }), devolucao_rs: nf.format, devolucao_pct: pct, fisica_pct: pct, fisica_fat: nf.format, fisica_pecas: nf.format, dev: nf.format, dev_pct: pct, desc_rem: pct, desc_loja: pct, desc_total: pct, fis_fat: nf.format, fis_qtd: nf.format, fis_pct: pct,
      margem: v => nf.format(Math.round(v)), margem_pct: pct, markup: mkx, fp_fat_pct: pct, fp_qtd_pct: pct, md_fat_pct: pct, md_qtd_pct: pct };
    // columns with expansion
    const cols = []; // {key, base, lab, start, sub, exp}
    GROUPS.forEach(([g, cs]) => cs.forEach(([k, l], i) => cols.push({ key: k, base: k, lab: l, start: i === 0, g })));
    const FMC = [['fat', 'Faturamento'], ['pecas', 'Peças'], ['pm', 'PM'], ['desc_rem', 'Desc. remarc.'], ['desc_loja', 'Desc. loja'], ['desc_total', 'Desc. total'], ['dev', 'Devolução R$'], ['dev_pct', 'Devolução %'], ['fis_fat', 'Venda física R$'], ['fis_qtd', 'Venda física peças'], ['fis_pct', '% venda física'], ['margem', 'Margem R$'], ['margem_pct', 'Margem %'], ['markup', 'Markup']];
    const FMS = new Set(['fat', 'desc_rem', 'dev', 'fis_fat', 'margem']);
    if (openFMAll) [['fp', 'Full price (FP)'], ['md', 'Markdown (MD)']].forEach(([p, g]) => FMC.forEach(([k, l], i) => cols.push({ key: p + ':' + k, base: k, lab: l, start: i === 0, seg: i > 0 && FMS.has(k), sub: p, g })));
    // header
    th.innerHTML = '';
    const h1 = document.createElement('tr'); h1.className = 'grp';
    const hl = document.createElement('th'); hl.rowSpan = 2; hl.className = 'sticky';
    const lb = document.createElement('button'); lb.type = 'button'; lb.dataset.k = 'loja'; lb.textContent = 'Loja'; hl.appendChild(lb);
    h1.appendChild(hl);
    const gnames = GROUPS.map(x => x[0]).concat(openFMAll ? ['Full price (FP)', 'Markdown (MD)'] : []);
    gnames.forEach(g => { const n = cols.filter(c => c.g === g).length; const t = document.createElement('th'); t.colSpan = n; t.className = 'gs'; if (g.startsWith('Full')) t.classList.add('g-fp'); if (g.startsWith('Mark')) t.classList.add('g-md'); t.textContent = g; h1.appendChild(t); });
    const tg = document.createElement('th'); tg.rowSpan = 2; tg.className = 'gs tgl';
    const xb = document.createElement('button'); xb.type = 'button'; xb.className = 'vv-exp-all';
    xb.textContent = openFMAll ? '− FP e MD' : '+ FP e MD'; xb.setAttribute('aria-expanded', String(openFMAll));
    xb.addEventListener('click', ev => { ev.stopPropagation(); openFMAll = !openFMAll; drawLojas(); });
    tg.appendChild(xb); h1.appendChild(tg);
    const h2 = document.createElement('tr');
    cols.forEach(c => {
      const t = document.createElement('th'); if (c.start) t.className = 'gs'; if (c.seg) t.classList.add('ss'); if (c.sub) t.classList.add('subc', c.sub);
      const sb = document.createElement('button'); sb.type = 'button'; sb.dataset.k = c.key; sb.textContent = c.lab; t.appendChild(sb);
      t.setAttribute('aria-sort', c.key === sortKey ? (sortDir > 0 ? 'ascending' : 'descending') : 'none');
      h2.appendChild(t);
    });
    th.append(h1, h2);
    th.querySelectorAll('button[data-k]').forEach(btn => btn.addEventListener('click', () => {
      const k = btn.dataset.k; if (k === sortKey) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'loja' ? 1 : -1; } drawLojas();
    }));
    // body
    tb.innerHTML = '';
    pin.concat(fl).forEach(r => {
      const tr = document.createElement('tr'); tr.dataset.key = r.loja;
      if (r.loja === 'REDE' || r.loja === 'LOJAS') tr.className = 'tot'; if (r.loja === 'ECOMMERCE') tr.className = 'ec'; if (r.loja === 'LOJAS') tr.classList.add('sep');
      const t0 = document.createElement('td'); t0.className = 'sticky';
      t0.textContent = r.loja === 'ECOMMERCE' ? 'E-commerce' : r.loja === 'REDE' ? 'Total rede' : r.loja === 'LOJAS' ? 'Total lojas físicas' : nice(r.loja); tr.appendChild(t0);
      cols.forEach(c => {
        const td = document.createElement('td'); const v = r[c.key];
        td.textContent = v == null || (typeof v === 'number' && !isFinite(v)) ? (c.key === 'vs_ly' && r.loja !== 'REDE' && r.loja !== 'LOJAS' ? 'sem base' : '—') : F[c.base](v);
        if (c.sub && ['fat', 'pecas', 'margem', 'dev', 'fis_fat', 'fis_qtd'].includes(c.base) && v != null) {
          const tot = (r['fp:' + c.base] || 0) + (r['md:' + c.base] || 0);
          if (tot) { const sp = document.createElement('span'); sp.className = 'shr'; sp.textContent = ' ' + p0.format(v / tot); td.appendChild(sp); }
        }
        if (c.start) td.classList.add('gs'); if (c.seg) td.classList.add('ss'); if (c.sub) td.classList.add('subc', c.sub);
        if (!c.sub && c.key === 'vs_ly' && v != null) cls(td, v);
        if (!c.sub && c.key === 'ating') cls(td, v - 1);
        if (!c.sub && c.key === 'dif') cls(td, v);
        if (((c.key === 'devolucao_pct' || c.base === 'dev_pct') && v > 0.2) || ((c.key === 'desc_loja_pct' || c.base === 'desc_loja') && v > 0.1)) td.classList.add('vv-flag');
        if (c.key.startsWith('md_')) td.classList.add('md');
        tr.appendChild(td);
      });
      const te = document.createElement('td'); te.className = 'gs tgl'; tr.appendChild(te);
      tb.appendChild(tr);
    });
  }

  dash.onData(() => {
    setText('[data-source="rede"][data-field="dados_ate"]', v => day(v), 'rede', (d, el) => d[0] && d[0].dados_ate);
    setText('[data-source="rede"][data-field="dias_corridos"]', nf.format, 'rede', d => d[0] && d[0].dias_corridos);
    setText('[data-source="rede"][data-field="dias_mes"]', nf.format, 'rede', d => d[0] && d[0].dias_mes);
    setText('[data-source="rede"][data-field="fat"]', brl, 'rede', d => d[0] && d[0].fat);
    setText('[data-source="rede"][data-field="desconto_pct"]', p0.format, 'rede', d => d[0] && d[0].desconto_pct);
    setText('[data-source="rede"][data-field="desconto_ly_pct"]', p0.format, 'rede', d => d[0] && d[0].desconto_ly_pct);
    setText('[data-source="analise"][data-field="texto"]', v => v, 'analise', d => (d.find(r => r.id === 'resumo') || {}).texto);
    setText('[data-source="resumo"][data-field="vs_ly"]', v => sgn(v, pf.format), 'resumo', d => d[0] && d[0].vs_ly);
    setText('[data-source="resumo"][data-field="ating_periodo"]', pf.format, 'resumo', d => d[0] && d[0].ating_periodo);
    setText('[data-source="resumo"][data-field="dif_periodo"]', v => sgn(v, brl), 'resumo', d => d[0] && d[0].dif_periodo);
    setText('[data-source="resumo"][data-field="projecao"]', brl, 'resumo', d => d[0] && d[0].projecao);
    setText('[data-source="resumo"][data-field="proj_pct"]', pf.format, 'resumo', d => d[0] && d[0].proj_pct);
    setText('[data-source="resumo"][data-field="meta_mes"]', brl, 'resumo', d => d[0] && d[0].meta_mes);
    setText('[data-source="resumo"][data-field="calcados_ating"]', pf.format, 'resumo', d => d[0] && d[0].calcados_ating);
    setText('[data-source="canais"][data-field="vs_ly_comp"]', v => sgn(v, pf.format), 'canais', (d, el) => (d.find(r => el.dataset.where === 'canal=' + r.canal) || {}).vs_ly_comp);
    const res = dash.data('resumo');
    if (res.status === 'ok' && res.data[0]) {
      cls($('#k-vsly'), res.data[0].vs_ly); cls($('#k-dif'), res.data[0].dif_periodo);
      cls($('#k-ating'), res.data[0].ating_periodo - 1); cls($('#k-projpct'), res.data[0].proj_pct - 1);
      cls($('#k-calc'), res.data[0].calcados_ating - 1);
    }
    const can = dash.data('canais');
    if (can.status === 'ok') { cls($('#k-fis'), (can.data.find(r => r.canal === 'Loja física') || {}).vs_ly_comp); cls($('#k-onl'), (can.data.find(r => r.canal === 'Online') || {}).vs_ly_comp); }
    setText('[data-source="analise"][data-field="texto"][data-where="id=evolucao"]', v => v, 'analise', d => (d.find(r => r.id === 'evolucao') || {}).texto);
        setText('[data-source="analise"][data-where="id=canal"]', v => v, 'analise', d => (d.find(r => r.id === 'canal') || {}).texto);
    drawCanal(); drawReads(); orderTop(); drawAting(); drawVar(); drawCat(); drawCanais(); drawLojas();
    if (!drawnOnce && dash.data('lojas').status === 'ok') {
      drawnOnce = true;
      const named = document.getElementById(location.hash.slice(1));
      if (named) { named.scrollIntoView(); dash.setLink(named.id); }
    }
  });
})();
</script>
</body></html>
